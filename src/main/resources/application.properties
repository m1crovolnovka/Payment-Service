spring.application.name=PaymentService

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true
spring.jpa.hibernate.ddl-auto=none

spring.cloud.openfeign.circuitbreaker.enabled=true
resilience4j.circuitbreaker.instances.randomServiceCB.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.randomServiceCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.randomServiceCB.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.randomServiceCB.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.randomServiceCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.randomServiceCB.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.randomServiceCB.permittedNumberOfCallsInHalfOpenState=3
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000
