spring.application.name=payment-service

spring.cloud.openfeign.circuitbreaker.enabled=true
resilience4j.circuitbreaker.instances.randomServiceCB.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.randomServiceCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.randomServiceCB.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.randomServiceCB.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.randomServiceCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.randomServiceCB.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.randomServiceCB.permittedNumberOfCallsInHalfOpenState=3
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

spring.mongodb.host=${DB_HOST}
spring.mongodb.port=${DB_PORT}
spring.mongodb.database=${DATABASE}

spring.cloud.compatibility-verifier.enabled=false

jwt.secret.key=${JWT_SECRET}
server.port=8086

random-service.url=https://www.random.org

management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${TRACE_URL}
logging.pattern.level=%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]
loki.url=${LOKI_URL}