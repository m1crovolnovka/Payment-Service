version: '3.9'

services:
  payment-mongodb:
    image: mongo:latest
    container_name: payment_mongodb
    env_file:
      - .env.docker
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=payment_user
      - MONGO_INITDB_ROOT_PASSWORD=payment_pass
      - MONGO_INITDB_DATABASE=payment_db
    networks:
      - payment-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://:29092,CONTROLLER://:29093,EXTERNAL://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_CONTROLLER_LOG_DIRS: '/var/lib/kafka/data'
    networks:
      - payment-network

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment_service
    ports:
      - "8086:8086"
    env_file:
      - .env.docker
    depends_on:
      - payment-mongodb
      - kafka
    networks:
      - payment-network

networks:
  payment-network:
    driver: bridge